spring.application.name=server

# 파일 모드: 서버를 껐다 켜도 데이터가 남음 (server/data/gilnote.mv.db, .gitignore에 포함)
spring.datasource.url=jdbc:h2:file:./data/gilnote
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
# update: 표가 있으면 유지하고, 새 칸만 추가
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# 녹음 파일 업로드 (기본 1MB -> 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
# 녹음 파일 저장 폴더 (server/data/audio, .gitignore에 포함됨)
gilnote.audio-dir=data/audio
